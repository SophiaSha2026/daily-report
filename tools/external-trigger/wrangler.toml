name = "daily-report-trigger"
main = "worker.js"
compatibility_date = "2026-08-01"

# UTC 表达式。ROUTES 里的键必须和这里逐字一致，否则 Worker 认不出来。
#   "45 12 * * *" = 北京当日 20:45  晚间托底检查（只提醒，云端算不了晚间系统）
# 2026-09-27 早盘系统整体归档，北京 07:30 派发 auction.yml 的 "30 23 * * *" 删掉。
# 不限定星期：Cloudflare 拒绝 "0-4" 这类星期范围，且跨 UTC 午夜时星期会错位。
# 流水线自己查交易日历，周末触发到了也会立刻退出。
[triggers]
crons = ["45 12 * * *"]
