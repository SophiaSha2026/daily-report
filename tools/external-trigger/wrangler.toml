name = "daily-report-trigger"
main = "worker.js"
compatibility_date = "2026-08-01"

# UTC 表达式。ROUTES 里的键必须和这里逐字一致，否则 Worker 认不出来。
#   "30 23 * * *" = 北京次日 07:30
#   "5 9 * * *"   = 北京当日 17:05
# 不限定星期：Cloudflare 拒绝 "0-4" 这类星期范围，且跨 UTC 午夜时星期会错位。
# 流水线自己查交易日历，周末触发到了也会立刻退出。
[triggers]
crons = ["30 23 * * *", "5 9 * * *"]
