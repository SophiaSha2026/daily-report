name: 4-刷新板块成分表 (每周日)

# 同花顺的成分接口挡裸 HTTP 客户端指纹，必须真浏览器，所以这一步单独一个
# workflow：装 chromium 比较重，不想拖慢每天都要跑的盘前和竞价。
# 抓不到就保留仓库里已提交的表，不会退化成残表。

on:
  # ===================================================================
  # 2026-09-12 全面本地化：仓库只做版本控制，所有流水线在本机跑。
  # 下面的 schedule 整块停用，云端不再自动触发、不再自动发信。
  # workflow_dispatch 保留：本机长时间关机时还能手动派发一次应急。
  # 恢复自动跑 = 取消这一段注释。
  # ===================================================================
  # schedule:
  #   - cron: "40 12 * * 0"    # 周日 20:40 BJT，排在刷代码表之后
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python src/refresh_sector.py
      - name: 提交板块表
        if: success()
        run: |
          # 推送模板和 auction.yml 的「提交数据」同款，理由见那里：
          # `pull --rebase --autostash || true` 吞掉冲突后 HEAD 停在
          # origin/main 上，push 是「Everything up-to-date」的空成功，
          # 这一版用 Playwright 真浏览器抓了 30 分钟的表就这么没了
          # （教训 15 / 16）。现在按 origin 上的 blob 核对，对不上就红。
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add cache/sector_map.parquet
          git diff --staged --quiet || git commit -m "chore: 刷新板块成分表"
          F="cache/sector_map.parquet"
          # WANT 取**工作区那份文件**的 blob，不是 HEAD 里的：被 .gitignore 挡住、
          # 或者 add 失败时，HEAD 里那份还是 checkout 带下来的旧内容，
          # 拿它和 origin 比会一路相等，这一步就成了永远通过的摆设。
          WANT=$(git hash-object "$F" 2>/dev/null || echo none)
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ok=""
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin "${{ github.ref_name }}"
            if ! git rebase --autostash -X theirs "origin/${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
            if git push "$URL" HEAD:${{ github.ref_name }}; then ok=1; break; fi
            sleep 5
          done
          git fetch -q origin "${{ github.ref_name }}" || true
          GOT=$(git rev-parse "origin/${{ github.ref_name }}:$F" 2>/dev/null || echo missing)
          if [ -z "$ok" ] || { [ "$WANT" != none ] && [ "$GOT" != "$WANT" ]; }; then
            echo "::error::板块成分表 $F 没推上 origin（want=$WANT got=$GOT）"
            exit 1
          fi
