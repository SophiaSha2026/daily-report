# =====================================================================
#  A股集合竞价选股 · 全部阈值集中在此文件
#  改这里就够了，不用动代码。改完 git push 即生效。
# =====================================================================

runtime:
  # 竞价三次快照的北京时间（HH:MM:SS）
  snapshot_t1: "09:19:40"   # 撤单前虚拟撮合价
  snapshot_t2: "09:23:30"   # 中段
  snapshot_t3: "09:25:10"   # 最终竞价结果（价格自此固定到 09:30）
  snapshot_t4: "09:25:40"   # 补采：只为把 T3 漏掉的票补回来，价格 9:25-9:30 固定
  hard_deadline: "09:26:30" # 超过此时刻仍未开始 -> 放弃并发告警邮件

  # 发信是**双阈值**，不是单个时刻：
  #   send_at       软时点。到点就发，不会更早。Claude 提前跑完也要等到这一刻，
  #                 所以正常情况下每天都是这一秒发出，可预期。
  #   send_deadline 硬上限。Claude 慢的时候允许压过软时点，但绝不允许越过这条线。
  #                 真越线说明链路出了非预期的慢，邮件顶部会写明，不会悄悄晚发。
  # 结构上保证不了越线：Claude 起跑时刻被闸门钉在 09:25:50，硬超时 2 分钟，
  # 最坏 09:27:50 结束，加上落盘和 enrich 启动约 8 秒 -> 09:27:58，
  # 离 09:28:30 还有 32 秒余量。这条线是报警器，不是常规路径。
  send_at: "09:27:30"       # 软：不早于此刻发信
  send_deadline: "09:28:30" # 硬：越过要在邮件里留痕
  timezone: "Asia/Shanghai"

universe:
  # ---- 盘前候选池构建（08:35 运行）----
  # 这一段的每个键都必须有代码真的执行它，两边读的是同一份键：
  # 生产 premarket.stage1/stage2，回填 learn/backfill.build_pool
  # （入池条件走同一个函数 premarket.include_mask）。
  # 2026-09-16 审计前 6/11 个键没有任何代码读（max_3d_gain_pct、in_hot_board、
  # min_listed_days、amount_ratio_5d_gte…），而真正生效的三条规则
  # （换手>=5、成交额前600、昨跌<=-9）写死在 premarket.py 里：
  # 用户改配置没效果，还以为「近3日涨幅>25% 已剔除」，实际 8 天里 3 只这种
  # 票进了邮件前 10。selftest.py 有断言钉住「配置里的键都有人读、
  # stage1 里不出现裸阈值」。
  max_candidates: 1600
  exclude_st: true            # 名字含 ST / 退（生产和回填同一判据）
  exclude_bj: false           # 北交所保留（30cm 已按涨停幅度归一化）
  min_listed_days: 60         # 次新股：日线不足这么多根就剔除。
                              # 生产在 stage2 按日线根数判，回填按窗口内根数判；
                              # stage1 另按名字的 N/C 前缀做一道零成本兜底
  min_mktcap_yi: 0            # 0 = 不限市值。当前快照源**没有总市值这一列**
  max_mktcap_yi: 0            # （腾讯低位字段里没有，硬约束 6 不许读高位字段），
                              # 设成非 0 会被 stage1 直接拒绝并发告警邮件 ——
                              # 不拒绝的话整池被筛空、当天发一封「今日无标的」
                              # 的空榜邮件，看起来完全像一个合法的空日
  exclude_yesterday_limit_down: true
  yesterday_drop_pct_max: -9.0   # 昨日涨幅 <= 此值剔除（昨日跌停）
  # 入池条件（满足任一）
  include_if:
    yesterday_limit_up: true       # 昨日涨停
    yesterday_gain_pct_gte: 5.0    # 昨日涨幅 >= 5%
    turnover_pct_gte: 5.0          # 昨日换手率 >= 5%
    amount_rank_top: 600           # 昨日成交额全市场前 600
  # 删掉的键，别加回来 —— 要加就得同时有代码执行它：
  #   max_3d_gain_pct / in_hot_board  全仓零引用，纯死配置
  #   include_if.amount_ratio_5d_gte  只有回填在用（生产两阶段收缩拿不到
  #     全市场日线，做不了入池条件）。它还让回填 24% 的行靠一条生产没有的
  #     规则进池，是回测池和生产池日均只重合 70% 的主因

# ---- 公告黑名单关键词（盘前扫描候选池的隔夜公告）----
announcement_blacklist:
  - 减持
  - 立案
  - 问询函
  - 关注函
  - 业绩预亏
  - 业绩下修
  - 商誉减值
  - 违规担保
  - 平仓
  - 解禁
  - 终止
  - 退市风险

# =====================================================================
#  竞价筛选阈值  —— 主要调参区
# =====================================================================
screen:
  # 竞价涨幅，**绝对百分点**，不按涨停幅度归一。
  # 2026-09-02 退回最初版本：「高开 2%-5% 区间（低于 2% 动能不足，
  # 高于 5% 警惕高开低走）」。两端都是硬性剔除，不是扣分。
  # 因为这是绝对数，20cm 的票高开 6% 照样出局，不会折算成 gap_norm 0.30 放行；
  # 反过来 20cm 的票高开 1.8% 也出局，不会因为「才走了涨停的 9%」被放行。
  # gap_norm 仍然照常计算并写进 detail.csv，只是不参与筛选和打分。
  gap_pct_min: 2.0          # 下限：低于 2% 动能不足
  gap_pct_max: 5.0          # 上限：高于 5% 警惕高开低走
  # 打分钟形函数峰值。3.5 恰好也是 [2,5] 的中点，但**不是因为是中点**才取它：
  # 它沿用旧配置对主板的判断（gap_norm_peak 0.35 = 主板 +3.5%）。
  # 以后再动区间，peak 不要跟着中点漂 —— 区间边界是准入条件，曲线形状是
  # 偏好强度，两者必须解耦（CLAUDE.md 历史教训第 10 条）。
  gap_pct_peak: 3.5

  # AUC_RATIO = 竞价成交额 / 昨日全天成交额
  # 与传统量比换算：量比 ≈ AUC_RATIO × 240（设昨日量 ≈ 5日均量）
  # 2026-09-02 退回最初版本：「2.5-10 倍明显放量」。
  auc_ratio_min: 0.0104     # 1.04%  ≈ 量比 2.5
  auc_ratio_max: 0.0417     # 4.17%  ≈ 量比 10
  auc_ratio_score_hi: 0.030 # 打分饱和点 3.0% ≈ 量比 7.2
  # 超过饱和点后的衰减速率：每 e 倍于饱和点扣 0.40 分（对数刻度）。
  # 必须独立给，不能由 auc_ratio_max 推导 —— 上限的含义是「还能接受」，
  # 不是「和饱和点一样好」。收窄上限时这一点同样要守住：量比 10 处得 0.87 分，
  # 是因为它离饱和点 7.2 只差 1.39 倍，不是因为它贴着上限。
  auc_ratio_decay: 0.40
  liangbi_per_auc_ratio: 240  # 只用于换算显示，不参与筛选

  # 【最初那张表里有一条没有启用，原因写在这里，不要当成遗漏】
  # 原表还有一行「竞价量能 ≥ 前一日全天成交量的 10%」。
  # 它和上面那两行约束的是**同一个变量**：等价于 auc_ratio_min = 0.10，
  # 也就是量比 24。而同一张表又要求量比 ≤ 10，即 auc_ratio ≤ 0.0417。
  #     要求 auc_ratio ≥ 0.10  同时  auc_ratio ≤ 0.0417   ->   空集
  # 拿 08-24 / 08-25 / 08-26 / 08-27 四天的真实快照实测：
  #     涨幅 2~5% 且量比 2.5~10        39 / 10 / 28 / 37 只
  #     上面再叠加「量能 ≥ 10%」         0 /  0 /  0 /  0 只
  # 这四天里涨幅 2~5% 且量能真到 10% 的票每天只有 1~2 只，而它们的量比是
  # 28~56，全部被「量比 ≤ 10」剔除。两条规则选的是不相交的集合。
  # 启用它就是每天发空榜。真要走 10% 这条口径，改法是把 auc_ratio_min 抬到
  # 0.10 的**同时**把 auc_ratio_max 抬到 0.10 以上（量比上限 24 以上），
  # 不能只打开下限。selftest.py 有断言钉住 min < 饱和点 < max。

  # 绝对流动性下限。取消市值限制后必须加这条：
  # 一只 5 亿市值的票竞价成交 20 万也能满足 1.04% 的比例条件，
  # 但那个盘口你根本买不进去，比例指标在小盘票上会失真。
  min_auc_amount_wan: 300   # 竞价成交额下限（万元）

  # 竞价形态
  # 注意：回填表的 slope 恒为 0（历史拿不到 09:19/09:23 两个采样点，
  # 见 learn/backfill.py 已知偏差 5），这条置 true 会把 404 天的训练行
  # **全部**判成剔除，学习线当场没有样本。要开先想清楚回填那条线怎么办。
  require_positive_slope: false   # T3涨幅 > T1涨幅 才入选（严格模式打开）
  last_min_dive_max: 2.0          # T2->T3 跳水超过此值(百分点)直接剔除
  fake_limit_t1_frac: 0.90        # T1 涨幅 >= 涨停幅度*0.90 视为"假涨停"
  fake_limit_t3_frac: 0.50        # 且 T3 < 涨停幅度*0.50 -> 撤单诱多

  # 位置与形态
  pos_pct_60d_max_for_lowbase: 0.40   # B组：60日价格分位上限
  breakout_lookback: 20               # A组：突破前 N 日平台高点

  # 板块共振
  sector_min_members: 3               # 候选池内同板块入选数
  concept_prev_limitup_min: 2         # 概念昨日涨停家数

  # 「高位极端放量」扣分的触发线，绝对量比，不从上面的区间推导。
  # 原表的排除类写「量比>10 倍 + 股价已在高位 -> 一律警惕剔除」。量比 >10 现在
  # 由 auc_ratio_max 一刀切掉（比原表更严：不看位置也剔除），这条已被完全覆盖。
  # 这里保留的是它的**降级预警**：高位 + 量比逼近上限，仍然扣分。
  # 不写成 auc_ratio_score_hi*2（=0.06，量比 14.4）—— 那个值超过了 4.17% 的上限，
  # 永远触发不了，是死代码。
  high_pos_liangbi_min: 8.0

output:
  merge_groups: true    # 合并 A/B，出一张总榜
  top_n: 10             # 合并后取前 10
  top_n_a: 10           # merge_groups=false 时才生效
  top_n_b: 6
  min_score: 45         # 低于此分不输出
  send_when_empty: true # 空榜也发信，明确告知今日无标的
  attach_csv: true      # 附完整候选池打分明细（含被剔除原因）
  ths_tiers: [80, 65]   # 同花顺分层板块阈值：>=80 强，>=65 中，其余 观察

scoring:
  weights:
    gap: 0.20
    volume: 0.25
    trend: 0.20
    position: 0.15
    sector: 0.15
    continuity: 0.05
  penalties:
    fake_limit_up: 40
    last_min_dive: 25
    high_pos_extreme_volume: 30
    one_word_limit: 100      # 一字板买不进，直接排除
    yesterday_broken_board: 15
    announcement_blacklist: 60

llm:
  enabled: true
  model: "claude-opus-5"       # 经 claude-code-action + OAuth 调用
  # 时间预算：T4 在 09:25:40，打分约 2 秒，发信卡在 09:27:30，
  # 留给 Claude 的净窗口约 105 秒。workflow 里的硬超时设 2 分钟兜底，
  # 超了就按「本次无 LLM 分析」发，不会卡住邮件。
  timeout_seconds: 100
  # LLM 只写"入选理由/风险提示"，绝不参与打分与排序
  # 撞额度/失败时：仍然发信，但在邮件顶部明确声明本次无 LLM 分析
  on_failure: send_with_notice

# =====================================================================
#  形态扫描：放量启动 -> 缩量回调 -> 再放量   （每交易日 17:00 BJT）
#  和上面的竞价流水线完全独立，共用的只有数据源和邮件底层。
# =====================================================================
pullback:
  run_at: "17:00:00"        # 收盘后。此刻当日行情已定，日线多半也出来了
  hard_deadline: "22:00:00" # 启动晚于此刻就放弃，发告警而不是发一份可疑的榜
  lookback_days: 90         # 拉多少个自然日的日线。daily_hist 内部要求 >=25 根
                            # K 线，90 个自然日约 60 根，留足余量

  # ---- 启动日 S ----
  # 「涨停或涨幅 >= 5%」只写后者：非 ST 的涨停幅度是 10/20/30%，全都 >= 5%，
  # 涨停是这条的真子集；ST 本来就排除。
  launch:
    gain_pct_min: 5.0
    vol_ratio_min: 1.5      # 成交量 / 前一交易日成交量。是量不是额
    turnover_min: 5.0       # 换手率下限 %
    turnover_max: 10.0

  # ---- 调整期 S+1 .. T-1 ----
  adjust:
    min_days: 1             # 「次日开始调整」隐含至少 1 天，S 不能就是昨天
    max_days: 6             # 用户给的上限
    vol_day_max_ratio: 1.0  # 期间**每一天**的量都要 < 启动日量 x 此值
    vol_mean_max_ratio: 0.8 # 期间均量 <= 启动日量 x 此值。这是「缩量」的量化
    low_floor_ratio: 1.0    # 期间最低价 >= 启动日最低价 x 此值

  # ---- 执行日 T（今天）----
  trigger:
    gain_pct_min: 5.0
    vol_ratio_min: 1.5
    turnover_min: 5.0
    turnover_max: 10.0

  output:
    top_n: 10
    send_when_empty: true   # 空榜也发信，明确告知今日没有符合形态的票

  # 打分只决定排序，不决定入选。三段条件全是硬门槛，过不了就不在榜上。
  scoring:
    vol_ratio_full: 4.0     # 量比打分的饱和点：1.5 倍得 0 分，4 倍得满分。
                            # 独立参数，不要从 vol_ratio_min 推导，
                            # 否则调准入门槛会顺带改掉打分口径（竞价那条线
                            # 踩过这个坑，见 CLAUDE.md 历史教训第 10 条）
  weights:
    trigger: 0.30           # 今日这一根的强度
    launch: 0.25            # 启动日那一根的强度
    shrink: 0.20            # 调整期缩量程度
    hold: 0.15              # 回调最低点在启动日 K 线里的相对位置
    speed: 0.10             # 调整天数，越短趋势越完整

  llm:
    enabled: true
    model: "claude-opus-5"
    timeout_seconds: 150    # 17:00 没有竞价那种秒级压力，给足时间

# =====================================================================
#  自评估 · 学习 · 迭代   （每交易日 16:30 BJT，独立 workflow）
#  完整设计见 docs/learning.md。这里只是旋钮。
#
#  本节里的参数是「学习系统自己的超参」，不是被学习的对象。
#  被学习的对象是上面 screen / scoring 里那几个，学到的值写进
#  state/learned.yaml，由 cfg.load() 合并。config.yaml 永远是人工基线 θ⁰。
# =====================================================================
learning:
  enabled: true
  run_at: "16:30:00"        # 收盘后。15:00 收盘，留 90 分钟等数据落定
  hard_deadline: "23:00:00"

  # ---- 标签 ----
  label:
    # r = 收盘 / 开盘 − 1。开盘价就是竞价撮合价，也就是买入价，
    # 所以这是可执行收益，不是纸面收益。
    max_open_mismatch_pct: 0.5   # 快照里的 auc_price 与日线开盘价偏离超过这个
                                 # 百分比 -> 标脏样本，不参与学习
    cost_bp: 13                  # 单边成本估计（万分之13：印花税10 + 佣金等）
                                 # 只在汇报里扣，不进优化目标——它是常数，不改排序

  # ---- 日内中性化 ----
  neutralize:
    center: median            # median / mean。用中位数：涨跌停会把均值拽偏
    winsor_q: 0.01            # 按当日 1% / 99% 分位缩尾
    scale: mad                # mad / std。MAD = 1.4826 × median(|y − median y|)
    min_pool: 200             # 当日有效样本少于此数 -> 整天丢弃，统计量不可靠

  # ---- 目标函数 ----
  objective:
    top_k: 10                 # 软 Top-K 的 K。等于榜单长度，两者要一致
    tau_perplexity_tol: 0.01  # 二分求温度 τ 的收敛容差（目标 exp(H)=K）
    huber_c: 1.345            # Huber M 估计的截断点。对高斯 95% 效率的标准取值。
                              # 它决定单日影响力上限 = c × MAD({G_d})
    # λ₀ 的校准依据（2026-09-03 实测，不是拍脑袋）：在 401 天回填表上
    # 对 θ⁰ 做单参数扰动探针，裸目标 Ĝ 的梯度量级是每 σ 约 0.02~0.03。
    # 【2026-09-16 作废一半】当时「最强方向是 trend 权重 ↑」是前视泄漏造出来的：
    # 回填的 slope 算的是开盘后的涨跌（见 learn/backfill.py 已知偏差 5）。
    # 修完口径后 trend 在回填数据上是常数（箱约束已按 learnable_dims 钉死它），
    # 这条梯度量级要在重建的训练表上重测。
    # 原值 8.0 在 N=401 时罚 1.83/σ²，要求信号比实际大十倍才放行，
    # 等于结构性永不迭代。按「均衡步长 ≈ 0.3σ」反解：λ₀ ≈ 0.25。
    # λ₀ 本身不必重校：N 改成**进入拟合的训练天数**之后（样本外那 20% 一行
    # 都没参与 fit，见 eval_daily.stage_learn 传的是 len(tr)），401 天的表上
    # λ_a 从 30/521=0.0576（N=401 全部天）升到 30/441=0.0680（N=321 训练段），
    # 锚定只会更紧，方向和「别让它在噪声上乱走」一致，校好的均衡步长仍然成立。
    # 防过拟合的主责在七道闸（走向前+自助+在线否决），锚定只管搜索正则。
    lambda_anchor: 0.25       # λ₀：锚定到人工配置 θ⁰ 的强度
    anchor_prior_days: 120    # n₀：人工配置值多少天的证据。
                              # λ_a(N_train) = λ₀ · n₀/(n₀+N_train)，N_train 是
                              # 训练段天数不是全部天数。见 docs/learning.md 4.4
    lambda_l1: 0.02           # 相对上一版 θ 的 L1。让更新稀疏 = 邮件可读。
                              # L1 的边际罚是常数 λ₁/σ，必须低于梯度量级
                              # （实测 0.02~0.03/σ）才可能有任何移动；又要高于
                              # 噪声方向的梯度才有稀疏作用。0.02 恰好卡在缝里。
                              # 0.6 和 0.15 都在起点造尖点把优化器钉死，实测过。

  # ---- 接受门（六道闸，全过才改）----
  gate:
    min_days: 60              # 少于 60 天，任何改善都在噪声里（见设计文档 5.1）
    oos_frac: 0.20            # 尾部 20% 的天数留作样本外
    bootstrap_n: 2000         # 按**天**重抽样。按行会把置信区间算窄好几倍
    bootstrap_p: 0.90         # 要求 P(新的样本外更好) ≥ 0.90
    # 闸门 2 的块一致性：样本外段按时间切成 oos_blocks 块各自比一次，至少
    # oos_min_blocks_better 块同向改善才算过。整段一个 Ĝ_oos 会把块间分歧
    # 抹平（09-16 那个提案三块是 +0.0095 / −0.0175 / −0.0134），而且相邻两次
    # 裁决的样本外段重叠 98%，「连着几次都过」几乎等于「过了一次」。
    # 代码里本来就有这两个旋钮（eval_daily 和 learn/gate.py 用 g.get 取，
    # 默认 3 / 2），写进来只是让它可见可改 —— 配置里看不见的旋钮等于没有。
    oos_blocks: 3
    oos_min_blocks_better: 2
    max_step_frac: 0.10       # 单参数每次移动上限 = 箱宽 × 此值
    max_moves: 2              # 一次最多动几个参数
    churn_lookback: 20        # 行为回放的天数
    max_churn: 0.40           # 任何一天前 10 的变动比例上限
    cooldown_days: 10         # 距上次接受变更的最小间隔
    # ---- 第七道闸：在线稳健性否决（2026-09-03 加）----
    # 训练用的是 404 天回填表，其中竞价轨迹(t1/t2)是代理值；在线快照才是
    # 真值。学到的参数必须在真值数据上「至少不明显更差」才许落地。
    # 在线天数还很少（起步 7 天），这道闸只做否决不做要求：
    # P(新参数在在线天上更好) < online_veto_p 才拦，样本不足时只记录不拦。
    online_veto_p: 0.25
    online_min_days: 5

  # ---- 影子排序器转正提案（learn/shadow.py，docs/learning.md 第 13 节）----
  # 影子每天和正式榜并排记账。在线真值天数够了、且按天自助显示影子的
  # 前 10 超额显著更高，系统才发一封「切换提案」邮件。切不切换是人的决定。
  shadow:
    min_days: 30              # 在线真值天数达到这个数才有资格提案
    p_better: 0.90            # 按天自助 P(影子前10超额 > 正式) 的门槛
    remind_days: 10           # 提案发出后，再次提醒的最小间隔（自然日）

  # ---- 可学参数的箱约束 ----
  # 只有列在这里的才可能被自动改。准入区间（gap_pct_min/max、auc_ratio_min/max）
  # 故意不在这里：那是用户定的规则，系统只能提案，见 propose_only。
  # 注意：这份箱是「理论上可学的全集」，真正交给优化器之前要先过
  # learn/sources.py::restrict_box() —— 它按这批训练数据**真能学**的维度
  # 把其余参数钉死（lo=hi=θ⁰）。回填数据里 trend 是常数、volume 的分母
  # 含开盘后成交，这两维不能学（2026-09-16）。
  # 裁法是钉死不是删键：objective.project 要求箱里 scoring.weights.* 那组
  # 的和恰好为 1，删掉两个权重键会让剩下四个被归一到 1，总权重变成 1.4。
  box:
    scoring.weights.gap:        [0.05, 0.40]
    scoring.weights.volume:     [0.05, 0.40]
    scoring.weights.trend:      [0.05, 0.40]
    scoring.weights.position:   [0.05, 0.35]
    scoring.weights.sector:     [0.05, 0.35]
    scoring.weights.continuity: [0.00, 0.20]
    screen.gap_pct_peak:        [2.5, 4.5]
    screen.auc_ratio_score_hi:  [0.015, 0.040]
    screen.auc_ratio_decay:     [0.20, 0.80]

  # 系统可以给建议值和证据，但**必须人工点头**才写入。
  propose_only:
    - screen.gap_pct_min
    - screen.gap_pct_max
    - screen.auc_ratio_min
    - screen.auc_ratio_max
    - output.min_score

  # ---- LLM 归因 Agent ----
  llm:
    enabled: true
    model: "claude-opus-5"
    timeout_seconds: 240      # 16:30 没有竞价那种秒级压力
    # 通道 4：参数变更的审稿人（learn/llm_review.py）。
    #   advisory  意见附在变更邮件里，不拦（默认）
    #   veto      「反对」把变更搁置，人工 apply-held 才落地。
    #             LLM 只能按暂停不能按删除，人永远有终审权。
    review_mode: advisory
    n_worst: 8                # 高分低收益，取几只
    n_best: 8                 # 低分高收益，取几只
    # day_regime -> 优化器里的日权重 w_d。映射写在这里 = 可审计、可复现。
    regime_weight:
      数据异常: 0.0           # 我们自己的数据错了，这天不该参与学习
      大盘系统性: 0.35        # 特征不预测指数，全权重只贡献方差
      情绪退潮: 0.70          # 真实但罕见的状态，降权不剔除
      板块轮动: 1.0
      正常: 1.0

  # ---- 学习会诊（2026-09-16，docs/council.md）----
  # 每次学习更新末尾，六个视角各起一个 claude 进程并行深挖「预测和实际差在哪」，
  # 主审汇总。半自动：提案先自动实验，过闸的进台账等控制台一键批准。
  council:
    enabled: true
    model: "claude-opus-5"
    effort: "max"             # CLI --effort：max 推理
    timeout_seconds: 900      # 每个视角（看门狗，到点杀，杀了再 resume 一次逼结论）
    chair_timeout_seconds: 1200  # 主审只读不查，但 max 推理一次能想十分钟
    max_parallel: 6
    max_turns: 60             # 一次工具调用算一轮。到上限会 resume 一次只许输出结论
    lenses: [gap_where, noise_or_real, features, regime, data_quality, improve]
    history_days: 0           # 早盘证据取多少个在线真值日，0 = 全部
    auto_experiments: true    # 会诊完自动跑 param / threshold / feature_drop 实验
    mail: true                # 会诊结论发一封邮件（SKIP_MAIL=1 时不发）
    # 跑的节奏（2026-09-16 用户定：每周一次 + 触发时加跑）。一次六个视角
    # 加主审实测花 20.23 美元，每个交易日都跑约 440 美元/月，而 17 天的样本里
    # 每天的增量信息很小，六个视角会反复说同一件事。
    # 手动跑（控制台按钮 / --stage council）不受这一段限制，随时可以问。
    cadence_days: 7           # 距上次会诊不足这么多天就不自动跑
    trigger_on_param_change: true   # 参数真的变过（learned.yaml / 起涨 overrides）就加跑
    trigger_new_truth: 10     # 自上次会诊又有这么多个名额的真值到期就加跑

  # ---- 历史回填（H 层）----
  backfill:
    start: "2025-01-01"
    # 历史日线还原不了竞价量能和竞价斜率（2026-09-02 实测：腾讯分钟线硬顶
    # 320 根 ≈ 1.3 天，东财分钟接口不通）。所以回填只能学下面这四个维度，
    # volume / trend 的参数必须靠在线积累。详见 docs/learning.md 第 2 节。
    # 买了 Tushare 的竞价包也一样：stk_auction_o 只有 open 是撮合价，
    # amount 含开盘后成交（中位偏高 25%~33%），轨迹根本没有。
    # 这个键以前没人读，现在由 learn/sources.py::restrict_box() 执行 ——
    # 不在这张表里的维度，对应的箱约束会被钉死在人工基线。
    learnable_dims: [gap, position, sector, continuity]
    workers: 4                # 和 daily_hist_many 一样保守，免费接口并发高就限流

  # ---- GBDT 老师（不是排序器，见 docs/learning.md 第 7 节）----
  teacher:
    enabled: true
    # 它只做两件事：估函数形式的天花板、给 gap 的形状提建议。
    # 绝不进生产打分路径——黑箱排名无法归因，也没法用规则语言讨论。
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    min_child_samples: 200
