# =====================================================================
#  A股流水线 · 阈值集中在此文件
#  改这里就够了，不用动代码。改完跑一次 python src/selftest_pullback.py。
#
#  2026-09-27 早盘系统（早盘选股 + 参数自学）整体归档，它的 runtime / universe /
#  screen / scoring / output / llm / learning 各段原样存在 archive/morning/config.yaml。
#  起涨预测的常量不在这里（在 src/breakout/daily.py 和 state/breakout/）。
# =====================================================================

# ---------------------------------------------------------------------
#  长期调整突破（内部代号 pullback）。每个交易日收盘后扫描，北京 17:58 发清单。
#  用户 2026-09-27 的规则和每个阈值的来历见 src/pullback.py 模块 docstring。
#  三段全是硬门槛；「最好」那三项只排序（bonus）。
#
#  频率（2026-09-27 用本机三年全市场日线回测，同一个判定函数）：
#  按下面这组默认值，2023-08 ~ 2026-09（全市场日线覆盖齐了的 749 个交易日）
#  剔除减持 / 定增之后共 54 次，平均每月约 1.5 次（剔除前 66 次），绝大多数交易日是空榜。
#  空榜也发信，写明「今天没有」。
# ---------------------------------------------------------------------
pullback:
  send_at: "17:58:00"       # 北京时间。扫描提前做完也等到这一刻才发；
                            # 本机那一刻没开机，开机补跑后立即发并在邮件里写明

  # ---- 横盘：首阳之前 ----
  base:
    days: 60                # 「3 个月以上」：首阳前 60 个交易日
    amp_max: 0.30           # 「窄幅震荡」：这 60 日收盘价 最高/最低 − 1 ≤ 30%
                            # （全市场任意一天这个数的中位约 33%，首阳候选的中位约 42%）
    vol_mean_mult: 3.0      # 「低成交量」：首阳量 ≥ 这 60 日均量 × 3
    vol_above_max: true     # 并且首阳量比这 60 日里任何一天都大（3 个月来最大量）

  # ---- 首阳：第一根大阳线 ----
  launch:
    vol_ratio_min: 1.5      # 倍量：成交量 ≥ 前一交易日 × 1.5（用户原话「至少 1.5 倍」）
    gain_min_other: 10.0    # 创业板 / 科创板 / 北交所：涨幅 ≥ 10%
                            # 沪深主板一律要求涨停（按昨收算涨停价，见 pullback.prepare）

  # ---- 调整：首阳次日起 ----
  adjust:
    min_days: 2             # 「随后两到三个交易日开始缩量调整」：至少调整 2 天
    max_days: 10            # 「调整一段时间后」：最多等 10 个交易日（两周）
    vol_day_max: 1.0        # 每一天的量都 < 首阳量 × 1.0（缩量）
    vol_mean_max: 0.8       # 整段均量 ≤ 首阳量 × 0.8（量能在缩，不是维持高位）
    floor: low              # 不跌破首阳的 low（最低价）；改 open 就是更严的「不破开盘价」
    close_cap: true         # 调整期收盘不超过首阳最高价（否则突破已经提前发生）

  # ---- 二次进攻：调整后第一次收盘站上首阳最高价的那一天 ----
  trigger:
    vol_ratio_min: 1.5      # 倍量：≥ 前一交易日 × 1.5
    big: same               # same  = 和首阳同一个大阳线定义（主板涨停 / 其余 ≥10%）
                            # loose = 只要涨幅 ≥ gain_min_loose 的阳线（回测频率约翻倍）
    gain_min_loose: 5.0

  # ---- 「最好」三项：不影响入选，只决定排序 ----
  bonus:
    shrink_half: 0.5        # 调整期最低量 ≤ 首阳量一半
                            # 另两项无参数：二次进攻量 > 首阳量；调整期最低价 ≥ 首阳开盘价

  guard:
    os_jump_max: 0.20       # 当日流通股本变动超过 20%（送转 / 大额解禁）：前后成交量不可比，
                            # 形态里任何一天出现就整段作废

  # ---- 剔除：形态成立了也不列（用户 2026-09-28）----
  # 「剔除近期有股东减持或者定向增发的股票（定增价格已经确定的除外）」。
  # 数据和判据见 src/corp_events.py：一律按公告日判，回看历史不偷看；
  # 当天的候选数据拉不到也剔（宁可为空）。
  exclude:
    reduce_days: 90         # 二次进攻那天往前 90 天内（含当天）有股东减持公告或交易所减持记录
                            # （公司卖回购股、「未实施减持」这类不算）
    placement_days: 730     # 往前两年内有增发预案、到那天还没发完也没终止，并且是竞价定价
                            # （价格没定）-> 剔。锁价（董事会决议日定价，价格已定）不剔

  output:
    history_n: 30           # 面板里列最近多少次历史成立
    panel_days: 10          # 面板顶上的日期下拉能选最近几个交易日的清单（含当天），
                            # 读 data/pullback/ 每天的存档；本机没跑的那天没有存档就不列
    forward_bars: 20        # 历史成立之后看多少根 K 线（只描述历史，不是预测）
