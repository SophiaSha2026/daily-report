name: 4-刷新板块成分表 (每周日)

# 同花顺的成分接口挡裸 HTTP 客户端指纹，必须真浏览器，所以这一步单独一个
# workflow：装 chromium 比较重，不想拖慢每天都要跑的盘前和竞价。
# 抓不到就保留仓库里已提交的表，不会退化成残表。

on:
  schedule:
    - cron: "40 12 * * 0"    # 周日 20:40 BJT，排在刷代码表之后
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python src/refresh_sector.py
      - name: 提交板块表
        if: success()
        run: |
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add cache/sector_map.parquet
          git diff --staged --quiet || git commit -m "chore: 刷新板块成分表"
          git pull --rebase --autostash || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main \
            || echo "::warning::push 失败"
