name: 2-竞价选股 (09:25 BJT)

# GitHub Actions 的 cron 是尽力而为：官方文档承认高负载会延迟，
# 社区实测整点附近常见 5-30 分钟，极端时被丢弃。
# 因此提前 38 分钟触发 + 三个错峰入口 + Job 内自旋等待到精确时刻。
on:
  schedule:
    - cron: "35 0 * * 1-5"   # 08:35 BJT
    - cron: "47 0 * * 1-5"   # 08:47 BJT
    - cron: "59 0 * * 1-5"   # 08:59 BJT
    - cron: "05 1 * * 1-5"   # 09:05 BJT
    - cron: "11 1 * * 1-5"   # 09:11 BJT 最后一班
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 幂等检查只看 data/auction_<date>.parquet 存不存在，而那个文件要到 09:27
# 才写出来。三个 cron 分别在 08:47/08:59/09:11 checkout，全都看不到它，
# 于是三个 job 并行跑完、发出三封一模一样的邮件。
# 加串行组：后来的排队等前一个跑完，那时 checkout 已经能看到数据文件，
# 幂等检查生效，整个 job 空跑跳过。
concurrency:
  group: auction-daily
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 最早的入口 08:35 触发，一路等到 09:28 发信、再提交和发 Pages，
    # 单 job 净跑约 55 分钟——今天实测 54m37s，离 55 分钟只剩 23 秒。
    # 再叠上候选池兜底那 4 分钟必然被杀。放到 75 分钟，等待期不额外计费。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 幂等检查（三个 cron 只跑一次）
        id: g
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          echo "date=$D" >> $GITHUB_OUTPUT
          if [ -f "data/${D:0:7}/auction_${D}.parquet" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.g.outputs.skip == 'false'
        with: { python-version: "3.11", cache: pip }

      - run: pip install -r requirements.txt
        if: steps.g.outputs.skip == 'false'

      # cron 是尽力而为：08:23 那班盘前有可能整个被丢掉（2026-08-24 当天
      # 四个 cron 一个都没触发）。候选池日期对不上就在这儿现建一份，
      # 约 4 分钟，离 09:14 预热还有余量。
      - name: 候选池新鲜度检查
        id: uni
        if: steps.g.outputs.skip == 'false'
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          if grep -q "\"date\": \"$D\"" cache/universe_meta.json 2>/dev/null; then
            echo "fresh=true"  >> $GITHUB_OUTPUT
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
          fi
      - name: 盘前候选池兜底
        if: steps.g.outputs.skip == 'false' && steps.uni.outputs.fresh == 'false'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python src/premarket.py

      # 阶段1：等待 -> T1/T2/T3/T4 -> 打分 -> 写 brief.json + prompt.md
      - name: 竞价采集与打分
        if: steps.g.outputs.skip == 'false'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python src/run_auction.py --stage quick

      # 采集环节可能提前退出（法定节假日是工作日但不开市、超死线、候选池缺失）。
      # 那种情况下 out/ 里是上一交易日的 brief.json，让 Claude 去分析它纯属
      # 白烧订阅额度——OAuth 走的是用户订阅同一个池子。所以这里设门。
      - name: 本轮是否真的出了清单
        id: q
        if: steps.g.outputs.skip == 'false'
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          if grep -q "\"date\": \"$D\"" out/run_meta.json 2>/dev/null; then
            echo "fresh=true"  >> $GITHUB_OUTPUT
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
            echo "::warning::本轮未产出今日清单，跳过 Claude 分析"
          fi

      # 阶段2：Claude 查证题材与风险。失败不阻断，邮件照发并声明。
      # 关键点：
      #  · v1 没有 prompt_file 参数，只有 prompt；model/allowed_tools/max_turns
      #    全部已废弃，必须走 claude_args
      #  · 用 --json-schema 拿结构化输出，比让模型自己写文件可靠
      #  · OAuth token 只对 Claude Code 有效、会被 Messages API 拒绝，
      #    所以必须走本 action，不能用 anthropic SDK 直连
      - name: Claude 分析
        id: llm
        if: steps.g.outputs.skip == 'false' && steps.q.outputs.fresh == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            先读 prompts/analyst.md 获取完整指令，再读 out/brief.json 获取今日数据。
            严格按 analyst.md 的检索策略和写作要求执行，按 json-schema 返回结果。
          claude_args: |
            --model claude-opus-5
            --max-turns 25
            --allowedTools "WebSearch,WebFetch,Read"
            --json-schema '{"type":"object","properties":{"items":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"reason":{"type":"string"},"risk":{"type":"string"}},"required":["code","reason","risk"]}}},"required":["items"]}'

      - name: 落盘 Claude 输出
        if: always() && steps.g.outputs.skip == 'false' && steps.q.outputs.fresh == 'true'
        env:
          RAW: ${{ steps.llm.outputs.structured_output }}
        run: python src/collect_llm.py

      - name: 发信 + 生成同花顺文件
        if: steps.g.outputs.skip == 'false'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          GH_OWNER:  ${{ github.repository_owner }}
          GH_REPO:   ${{ github.event.repository.name }}
        run: python src/run_auction.py --stage enrich

      - name: 提交数据（同时充当 60 天 keepalive）
        if: steps.g.outputs.skip == 'false'
        run: |
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add data/ out/ cache/ || true
          git diff --staged --quiet || git commit -m "data: ${{ steps.g.outputs.date }}"
          git pull --rebase --autostash || true
          # 必须显式带 token：claude-code-action 跑完会把 checkout 写进
          # .git/config 的凭证清掉，之后裸 git push 会报
          # 「Invalid username or token」。2026-08-24 实测踩到。
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}             || echo "::warning::push 失败"

      # 面板发布到 GitHub Pages，手机电脑都能直接打开，本地不用装任何东西
      # 同样要看日期戳：out/ 是提交进仓库的，采集没跑完时里面是上一交易日的
      # 面板，直接发上 Pages 就成了「昨天的榜挂着今天的链接」。
      - name: 准备 Pages
        if: steps.g.outputs.skip == 'false'
        run: |
          mkdir -p _site
          D=$(TZ=Asia/Shanghai date +%F)
          if grep -q "\"date\": \"$D\"" out/run_meta.json 2>/dev/null; then
            cp out/panel.html _site/index.html
            cp out/*.txt _site/ 2>/dev/null || true
          else
            echo "::warning::out/ 不是今天的产物，Pages 不更新"
            echo "<h1>今日暂无数据</h1>" > _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.g.outputs.skip == 'false'
        with: { path: _site }
      - uses: actions/deploy-pages@v4
        if: steps.g.outputs.skip == 'false'
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always() && steps.g.outputs.skip == 'false'
        with:
          name: auction-${{ steps.g.outputs.date }}
          path: |
            data/
            out/
          retention-days: 30
