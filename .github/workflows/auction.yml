name: 2-竞价选股 (09:25 BJT)

# GitHub Actions 的 cron 是尽力而为：官方文档承认高负载会延迟，
# 社区实测整点附近常见 5-30 分钟，极端时被丢弃。
# 实测两天都很糟：
#   2026-08-24 盘前那班延迟 97 分钟
#   2026-08-25 到 08:46 BJT 为止，盘前 + 竞价前三班 cron 一条都没触发
#
# 决定 job 能不能赶上竞价窗口的是**最早那个真正启动的入口**，
# 而不是入口个数：平台拥堵时所有 schedule 事件一起顺延。
# 所以把第一班提前到 07:40 BJT，容忍度从 44 分钟拉到 99 分钟
# （09:19:40 采 T1，07:40 + 99 分钟 = 09:19）。
# 早触发不影响采样：job 内一律自旋等待到精确时刻，代价只是空转占用 runner。
on:
  # ===================================================================
  # 本地为主、云端托底（2026-09-15 起）
  #
  # 本机计划任务 DailyReport-Local-Morning 是首选执行方。云端这条每天照常
  # 起来采样（09:19 采 T1 的时点等不起「本地失败了再启动」），但发不发信
  # 由 tools/yield_check.py 决定：
  #   本地推了 claim + sent  -> 云端不发信、不提交数据、只发布 Pages 面板
  #   本地没 claim / 没 sent -> 云端 09:27:30 照常发信 + 提交数据
  # 本地推了当日数据快照（09:25:42）就说明它活着，云端连 Claude 分析也省掉。
  #
  # 触发有两层：这里的 cron（GitHub 实测会迟到甚至丢班）+ Cloudflare Worker
  # 07:30 BJT 派发 workflow_dispatch（tools/external-trigger/）。
  # 重复触发无害：串行组 + 幂等检查。
  # ===================================================================
  schedule:
    # 注意跨 UTC 午夜：BJT 07:40 = UTC 23:40 前一天，所以星期写 0-4
    - cron: "40 23 * * 0-4"  # 07:40 BJT 第一班，主力容错入口
    - cron: "20 0 * * 1-5"   # 08:20 BJT
    - cron: "59 0 * * 1-5"   # 08:59 BJT
    - cron: "11 1 * * 1-5"   # 09:11 BJT 最后一班
  workflow_dispatch:
    inputs:
      force:
        description: "强制重跑：忽略幂等检查（当天已出过数据时也照跑）"
        type: boolean
        default: false
      late:
        description: "抢救模式：窗口已过，用今开当竞价价补一份清单（量能偏大，形态维度失效）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 幂等检查只看 data/auction_<date>.parquet 存不存在，而那个文件要到 09:27
# 才写出来。四个 cron 入口加 Worker 那一次派发，checkout 时全都看不到它，
# 于是几个 job 并行跑完、发出几封一模一样的邮件。
# 加串行组：后来的排队等前一个跑完，那时 checkout 已经能看到数据文件，
# 幂等检查生效，整个 job 空跑跳过。
concurrency:
  group: auction-daily
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 最早的入口 07:40 触发，一路自旋等到 09:27:30 发信、再提交和发 Pages。
    # 07:40 起算约 115 分钟，加上建候选池和 Pages 部署留足余量。
    # 08-24 实测从 08:35 起算是 54m37s。
    # 2026-09-04：本机备份触发最早 07:30 派发（tools/trigger_auction.cmd 有
    # 窗口闸），07:30 起算到 09:30 是 120 分钟；给到 175 是为了连「登录触发
    # 撞在 06:57」这种越窗派发也能撑到发信之后，而不是在 09:27 前几秒被杀。
    timeout-minutes: 175
    steps:
      # 必须显式给 ref。默认 checkout 的是 github.sha，而 workflow_dispatch
      # 的 github.sha **钉死在派发那一刻**。本机计划任务 09:05 派发、排队到
      # 09:27:49 才启动，checkout 拿到的还是 09:05 的旧 tip，看不到 09:27:32
      # 刚提交的当日数据，于是幂等检查失效、整条流水线重跑一遍、撞上死线，
      # 发出一封多余的「告警」邮件。2026-08-26 实际发生过。
      # 给了 ref 就变成 checkout 时刻的分支 tip，顺带也保证跑的是最新代码。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 入口一共五个：四条 cron（07:40/08:20/08:59/09:11 北京）+ Cloudflare
      # Worker 07:30 派发。不是八个，那是 2026-08 的旧排期。
      - name: 幂等检查（四个 cron + Worker 派发只跑一次）
        id: g
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          F="data/${D:0:7}/auction_${D}.parquet"
          echo "date=$D" >> $GITHUB_OUTPUT
          # 工作树 + 远端都查一遍。上面的 ref 已经解决了主要问题，
          # 这里再兜一层：前一个入口的提交可能正好落在我们 checkout 之后。
          git fetch -q origin "${{ github.ref_name }}" 2>/dev/null || true
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "force=true，忽略幂等检查"
          elif [ -f "$F" ] ||              git cat-file -e "origin/${{ github.ref_name }}:$F" 2>/dev/null; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "今天已经跑过（$F 已存在），整个 job 跳过"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.g.outputs.skip == 'false'
        with: { python-version: "3.11", cache: pip }

      - run: pip install -r requirements.txt
        if: steps.g.outputs.skip == 'false'

      # cron 是尽力而为：08:23 那班盘前可能延迟到竞价之后，甚至被丢掉
      # （2026-08-24 实测延迟 97 分钟）。候选池日期对不上就在这儿现建一份，
      # 实测 2 分 15 秒，离 09:14 预热有余量。
      - name: 候选池新鲜度检查
        id: uni
        if: steps.g.outputs.skip == 'false'
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          if grep -q "\"date\": \"$D\"" cache/universe_meta.json 2>/dev/null; then
            echo "fresh=true"  >> $GITHUB_OUTPUT
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
          fi
      - name: 盘前候选池兜底
        if: steps.g.outputs.skip == 'false' && steps.uni.outputs.fresh == 'false'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python src/premarket.py

      # 阶段1：等待 -> T1/T2/T3/T4 -> 打分 -> 写 brief.json + prompt.md
      - name: 竞价采集与打分
        if: steps.g.outputs.skip == 'false'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python src/run_auction.py --stage quick ${{ inputs.late && '--late' || '' }}

      # 采集环节可能提前退出（法定节假日是工作日但不开市、超死线、候选池缺失）。
      # 那种情况下 out/ 里是上一交易日的 brief.json，让 Claude 去分析它纯属
      # 白烧订阅额度——OAuth 走的是用户订阅同一个池子。所以这里设门。
      - name: 本轮是否真的出了清单
        id: q
        if: steps.g.outputs.skip == 'false'
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          if grep -q "\"date\": \"$D\"" out/run_meta.json 2>/dev/null; then
            echo "fresh=true"  >> $GITHUB_OUTPUT
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
            echo "::warning::本轮未产出今日清单，跳过 Claude 分析"
          fi

      # 阶段2：Claude 查证题材与风险。失败不阻断，邮件照发并声明。
      # 关键点：
      #  · v1 没有 prompt_file 参数，只有 prompt；model/allowed_tools/max_turns
      #    全部已废弃，必须走 claude_args
      #  · 用 --json-schema 拿结构化输出，比让模型自己写文件可靠
      #  · OAuth token 只对 Claude Code 有效、会被 Messages API 拒绝，
      #    所以必须走本 action，不能用 anthropic SDK 直连
      # 闸门：把 Claude 的起跑时刻钉死在 09:25:50。
      # 不加这一步的话起跑时刻取决于上一步跑多久，硬超时 2 分钟的**结束**时刻
      # 就不确定，发信硬上限也就无从保证。quick 阶段 T4 在 09:25:40，
      # 采样加打分约 5 秒，09:25:50 一定已经就绪。
      - name: 闸门（钉死 Claude 起跑时刻）
        id: gate
        if: steps.g.outputs.skip == 'false' && steps.q.outputs.fresh == 'true'
        run: |
          python - <<'PY'
          import datetime as dt, time, zoneinfo
          bj = zoneinfo.ZoneInfo("Asia/Shanghai")
          now = dt.datetime.now(bj)
          tgt = now.replace(hour=9, minute=25, second=50, microsecond=0)
          d = (tgt - now).total_seconds()
          if d <= 0:
              print(f"::warning::闸门时点已过 {-d:.0f}s，Claude 直接起跑")
          else:
              print(f"等待到 09:25:50，还有 {d:.0f}s")
              time.sleep(d)
          PY
          # 本地 09:25:42 会推当天的数据快照。推了就说明本地活着、马上要
          # 自己发信，云端的 Claude 分析纯属白烧订阅额度，跳过。
          # 本地之后要是没发出去，云端 09:28:20 仍会兜底发信，只是没有文案
          # （硬约束 2：LLM 缺席不阻断发信）。
          D=$(TZ=Asia/Shanghai date +%F)
          git fetch -q origin "${{ github.ref_name }}" 2>/dev/null || true
          if git cat-file -e "origin/${{ github.ref_name }}:data/${D:0:7}/auction_${D}.parquet" 2>/dev/null; then
            echo "local_alive=true" >> $GITHUB_OUTPUT
            echo "本地已推今日数据快照，跳过云端 Claude 分析"
          else
            echo "local_alive=false" >> $GITHUB_OUTPUT
          fi

      - name: Claude 分析
        id: llm
        if: steps.g.outputs.skip == 'false' && steps.q.outputs.fresh == 'true' && steps.gate.outputs.local_alive != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            先读 prompts/analyst.md 获取完整指令，再读 out/brief.json 获取今日数据。
            严格按 analyst.md 的检索策略和写作要求执行，按 json-schema 返回结果。
          claude_args: |
            --model claude-opus-5
            --max-turns 14
            --allowedTools "WebSearch,WebFetch,Read"
            --json-schema '{"type":"object","properties":{"items":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"reason":{"type":"string"},"risk":{"type":"string"}},"required":["code","reason","risk"]}}},"required":["items"]}'

      - name: 落盘 Claude 输出
        if: always() && steps.g.outputs.skip == 'false' && steps.q.outputs.fresh == 'true' && steps.gate.outputs.local_alive != 'true'
        env:
          RAW: ${{ steps.llm.outputs.structured_output }}
        run: python src/collect_llm.py

      # 本地为主、远端为辅：本地 TUI 一键跑会推 claim/sent 两个标记，
      # 这一步据此决定要不要让位。无 claim 时 09:27:00 立即放行，
      # 发信时刻分毫不受影响。协议全文见 src/local_run.py 模块注释。
      - name: 本地接管检查
        id: yield
        if: steps.g.outputs.skip == 'false'
        continue-on-error: true
        run: python tools/yield_check.py auction

      - name: 发信 + 生成同花顺文件
        if: steps.g.outputs.skip == 'false'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          GH_OWNER:  ${{ github.repository_owner }}
          GH_REPO:   ${{ github.event.repository.name }}
          SKIP_MAIL: ${{ steps.yield.outputs.skip_mail == '1' && '1' || '' }}
        run: python src/run_auction.py --stage enrich

      # 本地发了信就不提交：本地那份才是权威版本，云端再提交一份同名
      # 文件只会让两边的历史互相撞。云端自己发信的那天才提交。
      - name: 提交数据（同时充当 60 天 keepalive）
        if: steps.g.outputs.skip == 'false' && steps.yield.outputs.skip_mail != '1'
        # 末尾的告警要真发得出去：mailer._conf 全靠这几个环境变量，
        # 不给的话 KeyError 被 `|| true` 吞掉，又成了「只写日志」。
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          # 这一步以前是 `git pull --rebase --autostash || true` 然后 push 三次。
          # 本地 09:25:42 推过当日 parquet、而云端仍在兜底发信的那天（本地
          # quick 成功、enrich 挂了），rebase 一定冲突：cache/universe.parquet
          # 内容冲突、data/<月>/auction_<日>.parquet add/add 冲突。`|| true`
          # 把它吞掉，仓库停在 rebase-merge 中间态，HEAD 正好落在 origin/main
          # 上，于是第一次 push 输出 "Everything up-to-date"、rc=0、ok=1、
          # 跳出循环，::warning 永远不打印 —— 云端真正发出去的那份快照静默
          # 丢失，仓库里留的是本地那份（采样时刻不同），次日学习线按它标注训练。
          # 现在：先清残留再 rebase（教训 15），冲突取 theirs（今天是云端发的
          # 信，发出去的就是云端这份，和上面「本地发了信就不提交」同一个原则），
          # 最后不认 push 的退出码，认「origin 上那个 blob == 发信用的 blob」。
          D="${{ steps.g.outputs.date }}"; F="data/${D:0:7}/auction_${D}.parquet"
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add data/ out/ cache/ || true
          git diff --staged --quiet || git commit -m "data: $D"
          WANT=$(git rev-parse "HEAD:$F" 2>/dev/null || echo none)
          # 必须显式带 token：claude-code-action 跑完会把 checkout 写进
          # .git/config 的凭证清掉，之后裸 git push 会报
          # 「Invalid username or token」。2026-08-24 实测踩到。
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ok=""
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin "${{ github.ref_name }}"
            if ! git rebase --autostash -X theirs "origin/${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
            if git push "$URL" HEAD:${{ github.ref_name }}; then ok=1; break; fi
            sleep 5
          done
          git fetch -q origin "${{ github.ref_name }}" || true
          GOT=$(git rev-parse "origin/${{ github.ref_name }}:$F" 2>/dev/null || echo missing)
          if [ -z "$ok" ] || { [ "$WANT" != none ] && [ "$GOT" != "$WANT" ]; }; then
            echo "::error::今日快照 $F 没推上 origin（want=$WANT got=$GOT）"
            python -c "import sys; sys.path.insert(0,'src'); import mailer; mailer.send_alert('云端兜底日快照未入库: $F')" || true
          fi

      # 面板发布到 GitHub Pages，手机电脑都能直接打开，本地不用装任何东西。
      # 没有今日产物就整段跳过，而不是发一个「今日暂无数据」上去——那样会把
      # 上一个交易日的好面板冲掉，用户点开只剩一句空话。面板抬头自带日期，
      # 留着旧的不会误导。
      # 注意：空榜（当天确实没票通过筛选）走的是**有产物**这条路，enrich 会
      # 重新生成带「今日无标的通过筛选」的面板，不受这里影响。
      # Pages 发布以前的条件是「本 runner 自己产出了今日清单」。可是本地
      # 09:25:44 一推当日 parquet，后面每一班 cron 都在幂等检查（步骤 g）那里
      # skip=true 整个 job 跳过，连采样都不跑，fresh 自然不是 true ——
      # 2026-09-16 实测四班 cron 全走这条路，当天 Pages 能不能出完全押在
      # Cloudflare Worker 07:31 派发的那一次上。押失手的那天，邮件里的
      # 「在线面板」整天指向上一个交易日，而面板横幅还写着「会自动刷新」。
      # 所以另加一个判据：origin 上有没有今日的 out/run_meta.json。
      # 本地跑成功的日子它一定有（09:27:37 推 out:），云端只要把 origin 的
      # out/ 取下来发布一次就够，10 秒，幂等。
      - name: origin 上有没有今日面板
        id: r
        if: ${{ !cancelled() }}
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          git fetch -q origin "${{ github.ref_name }}" 2>/dev/null || true
          if git show "origin/${{ github.ref_name }}:out/run_meta.json" 2>/dev/null | grep -q "\"date\": \"$D\""; then
            echo "remote_fresh=true" >> $GITHUB_OUTPUT
          else
            echo "remote_fresh=false" >> $GITHUB_OUTPUT
          fi

      - name: 准备 Pages
        if: ${{ !cancelled() && (steps.q.outputs.fresh == 'true' || steps.r.outputs.remote_fresh == 'true') }}
        # 一个仓库只有一份 Pages 部署。以前这里是 mkdir _site && cp out/*，
        # 加了形态扫描那条线之后，谁后跑谁就把对方的页面整个冲掉。
        # build_site.py 从各个 out*/ 目录各取一份凑齐再发布。
        #
        # 本地发了信的话，本地那份面板（带 Claude 文案）已经推到 origin，
        # 用它而不是云端自己生成的（云端跳过了 Claude 分析）。晚间系统的
        # 面板只有本地能生成，也从 origin 拿最新的。
        #
        # 但 checkout origin -- out 必须先核对日期。本地推 sent（09:27:32）和
        # 推 out（09:27:35）是两次独立的 push，中间那 3 秒断网或 GitHub 5xx，
        # 云端 09:28:30 就会拿**上一个交易日**的 out/ 覆盖掉自己刚生成的今日
        # 面板（内嵌 stamp 和 stamp.txt 一起换旧，页面的自刷新也不会触发），
        # 而它手里那份日期是对的，只是缺 LLM 文案。纯退化，所以宁可用自己的。
        # python3：skip=true 那条路上 setup-python 没跑过，
        # build_site 只用标准库，系统 python3 就够。
        run: |
          D="${{ steps.g.outputs.date }}"
          git fetch -q origin "${{ github.ref_name }}" 2>/dev/null || true
          if [ "${{ steps.yield.outputs.skip_mail }}" = "1" ] || [ "${{ steps.q.outputs.fresh }}" != "true" ]; then
            if git show "origin/${{ github.ref_name }}:out/run_meta.json" 2>/dev/null | grep -q "\"date\": \"$D\""; then
              git checkout "origin/${{ github.ref_name }}" -- out 2>/dev/null || true
            else
              echo "::warning::origin 的 out/ 不是 $D 的（本地 out 还没推到），改用云端自己生成的今日面板（无 LLM 文案）"
            fi
          fi
          for d in out_breakout out_learn out_pullback; do
            git checkout "origin/${{ github.ref_name }}" -- "$d" 2>/dev/null || true
          done
          python3 src/build_site.py
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && (steps.q.outputs.fresh == 'true' || steps.r.outputs.remote_fresh == 'true') }}
        with: { path: _site }
      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() && (steps.q.outputs.fresh == 'true' || steps.r.outputs.remote_fresh == 'true') }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always() && steps.g.outputs.skip == 'false'
        with:
          name: auction-${{ steps.g.outputs.date }}
          path: |
            data/
            out/
          retention-days: 30
