name: 6-自评估与迭代

# 收盘后跑。和早上 07:30 的竞价线、17:00 的形态线互不相干：
# 这条线崩了不影响任何一封业务邮件（docs/learning.md 第 1 节边界 2）。
#
# 16:30 BJT = 08:30 UTC。收盘 15:00，留 90 分钟等数据落定。
# 迟一两小时无所谓，收盘后数据是定死的；真正要防的是早：stage label 按
# **北京 15:05 这口钟**退出（eval_daily.stage_label，审计 F3-15），不是查快照
# 存在性 —— 快照 09:25:45 就落盘了，拿它当闸盘中照样放行，把 10:00 的现价
# 当收盘价写进标签，而 labels.save 的「可用行更多才覆盖」还会让收盘后正确的
# 那份被拒，错标签永久留下。下面的交易日闸门用同一口钟算目标日。

on:
  # ===================================================================
  # 2026-09-12 全面本地化：仓库只做版本控制，所有流水线在本机跑。
  # 下面的 schedule 整块停用，云端不再自动触发、不再自动发信。
  # workflow_dispatch 保留：本机长时间关机时还能手动派发一次应急。
  # 恢复自动跑 = 取消这一段注释。
  # ===================================================================
  # schedule:
  #   - cron: "30 8 * * *"      # 16:30 BJT
  workflow_dispatch:
    inputs:
      stage:
        description: "label / brief / learn / race / backfill / 全流程留空"
        required: false
        default: ""
      date:
        description: "指定日期 YYYY-MM-DD，留空=今天"
        required: false
        default: ""
      dry:
        description: "dry-run：算但不写参数不发信"
        type: boolean
        default: false

concurrency:
  group: learn
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # scikit-learn / scipy 只有这条线用得到。竞价线和形态线的依赖没变，
      # 它们不会因为这里多装了东西而变慢或变脆。
      - name: 装依赖
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pandas pyarrow pyyaml requests akshare \
                        scikit-learn scipy

      - name: 交易日闸门
        id: gate
        run: |
          # 目标日 = 最近一个**已收盘**的交易日，和 local_run.last_closed_trade_day
          # 以及 eval_daily.stage_label 同一口钟（北京 15:05）。
          # 以前这里只判「今天是不是交易日」，手动派发落在盘中时闸门放行、
          # 紧接着 stage label 用 15:05 那口钟退出码 1，整条 workflow 红一次，
          # 而红的原因和「学习线出错」长得一模一样；周末派发则直接没有目标日。
          # 日历取不到时退化成「周一到周五」（fail-open，同 local_run）。
          python - <<'PY'
          import os, datetime as dt
          bj = dt.datetime.utcnow() + dt.timedelta(hours=8)
          closed = (bj.hour, bj.minute) >= (15, 5)
          days = set()
          try:
              import akshare as ak
              days = {str(d) for d in
                      ak.tool_trade_date_hist_sina()["trade_date"].astype(str)}
          except Exception as e:
              print(f"交易日历取不到（{e}），按周一到周五算")
          target = ""
          for back in range(15):
              d = bj.date() - dt.timedelta(days=back)
              ok = (d.isoformat() in days) if days else d.weekday() < 5
              if ok and (back > 0 or closed):
                  target = d.isoformat()
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"go={'1' if target else '0'}\n")
              f.write(f"date={target}\n")
          print(f"北京 {bj:%Y-%m-%d %H:%M}，目标日 " + (target or "无（15 天内没有已收盘交易日）"))
          PY

      - name: 抓标签
        if: steps.gate.outputs.go == '1'
        env:
          TZ: Asia/Shanghai
        run: |
          python src/eval_daily.py --stage label \
            --date "${{ github.event.inputs.date || steps.gate.outputs.date }}"

      - name: 准备归因输入
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        run: |
          python src/eval_daily.py --stage brief \
            --date "${{ github.event.inputs.date || steps.gate.outputs.date }}"

      # LLM 只做归因，产出落 state/llm_eval/<date>.json。
      # 它的影响通过 config 里那张 regime_weight 映射表进入优化器，
      # 全程可审计、可复现。失败不阻断后面的学习步骤。
      - name: LLM 归因
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            按 prompts/eval_analyst.md 的要求，读 out_learn/eval_brief.json，
            对当天的预测-实际偏差做归因，把结果写入
            state/llm_eval/${{ steps.gate.outputs.date }}.json
          claude_args: >-
            --model claude-opus-5
            --max-turns 20
            --allowed-tools "Read,Write,WebSearch,WebFetch"

      - name: 拟合与闸门
        if: steps.gate.outputs.go == '1'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python src/eval_daily.py --stage learn \
            --date "${{ github.event.inputs.date || steps.gate.outputs.date }}" \
            ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}

      - name: 提交结果
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name  "learn-bot"
          git config user.email "learn-bot@users.noreply.github.com"
          # learn.html 必须入库：Pages 部署在另一个 job 的另一次 checkout 里，
          # 不提交它就永远上不了线（历史教训 7）。17:00 形态线的部署会带它上线。
          git add -A data/labels state docs out_learn/learn.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无改动"
            exit 0
          fi
          git commit -m "learn: ${{ steps.gate.outputs.date }}"
          # 推送模板和 auction.yml 的「提交数据」同款：竞价线可能在同时提交数据，
          # 而 `pull --rebase || true` 把冲突吞掉之后仓库停在 rebase-merge 中间态、
          # HEAD 落在 origin/main 上，push 就是 "Everything up-to-date" 的空成功
          # （教训 15 / 16）。learn.html 丢了 = 当天的裁决上不了 Pages（教训 7）。
          # 显式带 token：上面的 claude-code-action 跑完会把 checkout 写进
          # .git/config 的凭证清掉，裸 `git push origin` 会报 Invalid username or token。
          F="out_learn/learn.html"
          WANT=$(git hash-object "$F" 2>/dev/null || echo none)
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ok=""
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin "${{ github.ref_name }}"
            if ! git rebase --autostash -X theirs "origin/${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
            if git push "$URL" HEAD:${{ github.ref_name }}; then ok=1; break; fi
            sleep 5
          done
          git fetch -q origin "${{ github.ref_name }}" || true
          GOT=$(git rev-parse "origin/${{ github.ref_name }}:$F" 2>/dev/null || echo missing)
          if [ -z "$ok" ] || { [ "$WANT" != none ] && [ "$GOT" != "$WANT" ]; }; then
            echo "::error::学习产物没推上 origin（$F want=$WANT got=$GOT），当天的裁决上不了 Pages"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-${{ steps.gate.outputs.date }}
          path: |
            out_learn/
            state/learning_status.json
          retention-days: 30
          if-no-files-found: ignore
