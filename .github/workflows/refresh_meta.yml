name: 3-刷新板块缓存 (每周日)

on:
  # ===================================================================
  # 2026-09-12 全面本地化：仓库只做版本控制，所有流水线在本机跑。
  # 下面的 schedule 整块停用，云端不再自动触发、不再自动发信。
  # workflow_dispatch 保留：本机长时间关机时还能手动派发一次应急。
  # 恢复自动跑 = 取消这一段注释。
  # ===================================================================
  # schedule:
  #   - cron: "17 12 * * 0"    # 周日 20:17 BJT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python src/refresh_meta.py
      - name: 提交缓存
        run: |
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add cache/
          git diff --staged --quiet || git commit -m "chore: 刷新板块缓存"
          git pull --rebase --autostash || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}             || echo "::warning::push 失败"
