name: 3-刷新板块缓存 (每周日)

on:
  schedule:
    - cron: "17 12 * * 0"    # 周日 20:17 BJT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python src/refresh_meta.py
      - name: 提交缓存
        run: |
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add cache/
          git diff --staged --quiet || git commit -m "chore: 刷新板块缓存"
          git pull --rebase --autostash || true
          git push || echo "::warning::push 失败"
