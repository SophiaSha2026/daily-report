name: 6-接力守护 (自我续期)

# =============================================================================
#  为什么存在
#
#  GitHub 的 schedule 是尽力而为，实测两次严重失灵：
#    2026-08-24  盘前那班迟 97 分钟
#    2026-08-27  形态那三班迟 10 小时 25 分，跨过午夜直接作废
#    2026-08-28  竞价八个入口一班都没触发
#  本机计划任务同一天也没救场（机器睡着，唤醒定时器被电源策略禁用）。
#
#  这个 workflow 不依赖 schedule。它自己接力：每一棒在结束前派发下一棒，
#  首尾相接，只要有一棒活着，链条就不会断。首次点火用下面那个 cron，
#  或者手动 Run workflow 一次即可。
#
#  代价：几乎全天占着一个 runner（公开仓库不计费，但确实是持续占用）。
#  这是拿资源换确定性，是刻意的取舍。
#
#  为什么不会跑出两条链：concurrency + cancel-in-progress，新一棒启动时
#  把旧的那棒取消掉。旧那棒本来也马上要结束了，所以没有副作用；反而顺手
#  解决了「手抖点了两次导致链条分裂」的问题。
# =============================================================================
on:
  schedule:
    - cron: "17 */6 * * *"   # 仅作点火与自愈，链条断了最多 6 小时内重新起来
  workflow_dispatch:

permissions:
  contents: read
  actions: write            # 派发别的 workflow 和自己都需要

concurrency:
  group: watchdog-chain
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # GitHub 单 job 上限 6 小时，留 10 分钟余量
    steps:
      - name: 睡到下一个关键时刻，到点派发，然后交棒
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # 关键时刻（北京时间）：
          #   07:30  竞价。job 内会自旋等到 09:19:40 采 T1，早到无害
          #   17:05  形态。收盘后数据已定，且在 run_at 之后不会被 MAX_WAIT 拦
          bj() { TZ=Asia/Shanghai date "$@"; }
          now=$(date +%s)
          best=""; target=""
          for spec in "07:30 auction.yml" "17:05 pullback.yml"; do
            hm=${spec%% *}; wf=${spec##* }
            for d in 0 1; do
              day=$(TZ=Asia/Shanghai date -d "+${d} day" +%F)
              t=$(TZ=Asia/Shanghai date -d "${day} ${hm}" +%s 2>/dev/null) || continue
              if [ "$t" -gt "$now" ]; then
                if [ -z "$best" ] || [ "$t" -lt "$best" ]; then best=$t; target=$wf; fi
                break
              fi
            done
          done

          cap=$(( now + 5*3600 + 30*60 ))      # 这一棒最多睡 5 小时 30 分
          if [ -z "$best" ] || [ "$best" -gt "$cap" ]; then
            echo "下一个关键时刻超出本棒能覆盖的范围，睡到上限后直接交棒"
            sleep_to=$cap; target=""
          else
            sleep_to=$best
          fi
          secs=$(( sleep_to - now ))
          echo "现在北京 $(bj '+%F %T')，睡 $((secs/60)) 分钟；到点后派发: ${target:-无（仅交棒）}"
          sleep "$secs"

          if [ -n "$target" ]; then
            D=$(bj +%F)
            dow=$(bj +%u)                      # 1-5 才是工作日
            if [ "$dow" -le 5 ]; then
              echo "北京 $(bj '+%F %T')，派发 $target"
              gh workflow run "$target" --ref main -R "${{ github.repository }}" \
                || echo "::warning::派发 $target 失败"
            else
              echo "北京 $D 是周末，跳过派发"
            fi
          fi

      - name: 交棒（派发下一棒）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # always() 很关键：上一步就算超时或出错，链条也必须续上，
          # 否则一次意外就把守护本身弄断了。
          gh workflow run watchdog.yml --ref main -R "${{ github.repository }}" \
            || echo "::error::交棒失败，链条已断！等 cron 在 6 小时内重新点火"
