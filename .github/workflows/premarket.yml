name: 1-盘前候选池 (08:35 BJT)

on:
  schedule:
    - cron: "23 0 * * 1-5"   # 08:23 BJT，避开整点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: 构建候选池
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python src/premarket.py
      # 必须 commit：竞价 job 是另一次 checkout，读的是仓库里的
      # cache/universe.parquet。只上传 artifact 的话竞价那边拿不到，
      # run_auction.py 会走「候选池缺失」分支直接告警退出。
      - name: 提交候选池
        run: |
          git config user.name auction-bot
          git config user.email bot@users.noreply.github.com
          git add cache/
          git diff --staged --quiet || git commit -m "data: 候选池 $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase --autostash || true
          # 重试三次：盘前和竞价可能同时往 cache/ 推，撞上就 rebase 再来。
          # push 失败的代价不只是丢数据——幂等检查靠的就是那个数据文件，
          # 推不上去，后面排队的入口会以为今天还没跑过。
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ok=""
          for i in 1 2 3; do
            if git push "$URL" HEAD:${{ github.ref_name }}; then ok=1; break; fi
            sleep 5
            git pull --rebase --autostash || true
          done
          [ -n "$ok" ] || echo "::warning::push 失败"
      - uses: actions/upload-artifact@v4
        with: { name: universe, path: cache/, retention-days: 3 }
